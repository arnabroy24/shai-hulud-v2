name: "SECURE EXAMPLE: metadata-only reviewer assignment"

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  assign-from-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Explain the safe trust boundary
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "A production implementation may use the GitHub API for PR ${PR_NUMBER}."
          echo "It must not check out or execute pull-request content."
