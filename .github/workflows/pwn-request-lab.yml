name: "LAB: vulnerable reviewer assignment"

# INTENTIONALLY VULNERABLE FOR A CONTROLLED SECURITY LAB.
# Never copy this workflow into a production repository.
on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: pwn-request-lab-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  vulnerable-reviewer-assignment:
    name: Execute PR-controlled reviewer script
    if: >-
      github.event.pull_request.head.repo.fork == true
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout the untrusted fork head (intentional vulnerability)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Run reviewer assignment code from the PR head (intentional vulnerability)
        env:
          LAB_BOT_PAT: ${{ secrets.LAB_BOT_PAT }}
        run: node .github/scripts/assign-reviewers.js

      - name: Upload controlled lab output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pwn-request-proof-pr-${{ github.event.pull_request.number }}
          path: lab-output/
          if-no-files-found: error
          retention-days: 1
